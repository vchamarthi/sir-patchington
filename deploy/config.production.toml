# Enrollment is intentionally empty. Production refuses startup until an owner
# adds real repository identities, trusted requirements/checks and principals.
mode = "production"
model = "claude-cli"
execution_image = "python@sha256:2f17fc044b579bab302c2e8054d3a686e2cb9a83de48e70534b94cd8ebbe06a9"
artifacts_path = "/var/lib/patchington/artifacts"
lease_seconds = 120
tenant_concurrency = 4
reconcile_interval_seconds = 300

# [[repositories]]
# tenant = "your-tenant"
# team = "your-team"
# installation_id = 123  # Replace with authoritative GitHub identities.
# write_installation_id = 789  # Separate write App's actual installation; never infer from read App.
# repository_id = 456
# repo = "your-org/your-repository"
