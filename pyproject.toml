[project]
name = "sir-patchington"
version = "0.1.0"
description = "Modular, evidence-driven organization PR review and repair control plane"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "sqlalchemy>=2.0.40,<2.1", "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<1", "PyJWT[crypto]>=2.10,<3"
]

[project.scripts]
patchington = "patchington.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "PyYAML>=6,<7", "markdown-it-py>=3,<5"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patchington"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: real PostgreSQL integration", "docker: actual isolated container execution"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
