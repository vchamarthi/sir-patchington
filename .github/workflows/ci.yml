name: Offline correctness and isolated execution

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: correctness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: patchington_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d patchington_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PATCHINGTON_TEST_DATABASE_URL: postgresql+psycopg://postgres:isolated-ci-only@127.0.0.1:5432/patchington_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, primary API verified 2026-10-21
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0, dereferenced annotated v6 tag
        with:
          version: "0.11.26"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check src tests deploy
      - name: Provision trusted offline execution image
        run: |
          docker pull python@sha256:2f17fc044b579bab302c2e8054d3a686e2cb9a83de48e70534b94cd8ebbe06a9
          docker tag python@sha256:2f17fc044b579bab302c2e8054d3a686e2cb9a83de48e70534b94cd8ebbe06a9 python:3.12-slim
      - name: Behavioral, PostgreSQL, and actual isolated execution tests
        run: uv run pytest -q
      - name: Validate Compose structure
        run: docker compose config --quiet
      - name: Build nonroot service image
        run: docker build --platform linux/amd64 -t sir-patchington:ci .
      - name: Service image startup without network or model authentication
        env:
          PATCHINGTON_TEST_SERVICE_IMAGE: sir-patchington:ci
        run: uv run pytest tests/test_deployment.py -q
